<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fa' }}" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#120f0d">
  
  {% seo %}

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body id="top">

  <div class="reading-progress" aria-hidden="true">
    <div class="reading-progress-bar" id="readingProgressBar"></div>
  </div>

  <a class="skip-link" href="#main-content">پرش به محتوای اصلی</a>

  {% include header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  {% include footer-style.html %}

  <button class="scroll-top" id="scrollTopBtn" type="button" aria-label="بازگشت به بالای صفحه">↑</button>

  <script src="{{ '/script.js' | relative_url }}" defer></script>

</body>
</html>
