# =====================================================
# تنظیمات اصلی وب‌سایت حسین محمدی آمیرزا
# =====================================================

title: "حسین محمدی آمیرزا"
tagline: "روایت انسان، در امتداد تاریخ"
description: "وب‌سایت رسمی حسین محمدی آمیرزا؛ نویسنده، شاعر، پژوهشگر تاریخ و فیلمنامه‌نویس"

keywords: "حسین محمدی آمیرزا, نویسنده, شاعر, پژوهشگر تاریخ, فیلمنامه‌نویس, کتاب, شعر, داستانک, وبلاگ"
logo: "/images/hossein-mohammadi.png"
image: "/images/og-cover.jpg"

lang: "fa"
locale: "fa_IR"
timezone: "Asia/Tehran"
encoding: "utf-8"
date_format: "%Y/%m/%d"

# ⚠️ مهم: مخزن شما special repository است → سایت در ریشه دامنه منتشر می‌شود
url: "https://hossein-amirza.github.io"
baseurl: ""

# =====================================================
# نویسنده
# =====================================================

author:
  name: "حسین محمدی آمیرزا"
  bio: "نویسنده، شاعر، پژوهشگر تاریخ و فیلمنامه‌نویس"

social:
  name: "حسین محمدی آمیرزا"
  links: []

# =====================================================
# منوی اصلی
# =====================================================

navigation:
  - title: "خانه"
    url: "/"
  - title: "درباره من"
    url: "/about/"
  - title: "کتاب‌ها"
    url: "/books/"
  - title: "فیلمنامه‌ها"
    url: "/screenplays/"
  - title: "نمایشنامه‌ها"
    url: "/plays/"
  - title: "داستانک‌ها"
    url: "/stories/"
  - title: "شعرها"
    url: "/poetry/"
  - title: "وبلاگ"
    url: "/blog/"
  - title: "مجموعه‌های نمایشی"
    url: "/series/"
  - title: "تماس"
    url: "/contact/"

# =====================================================
# موتور Markdown
# =====================================================

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false

# وبلاگ: آدرس /blog/… (نه /articles/)
permalink: /blog/:year/:month/:title/

relative_links:
  enabled: true
  collections: true

# =====================================================
# انتشار محتوا
# =====================================================

future: false
show_excerpts: true
excerpt_separator: "<!--more-->"

# صفحه‌بندی وبلاگ
paginate: 10
paginate_path: "/blog/page/:num/"

# =====================================================
# مجموعه‌ها — هر بخش پوشه مستقل خودش
# =====================================================

collections:

  books:
    output: true
    permalink: /books/:name/
    sort_by: "date"

  screenplays:
    output: true
    permalink: /screenplays/:name/
    sort_by: "date"

  plays:
    output: true
    permalink: /plays/:name/
    sort_by: "date"

  stories:
    output: true
    permalink: /stories/:name/
    sort_by: "date"

  poetry:
    output: true
    permalink: /poetry/:name/
    sort_by: "date"

  series:
    output: true
    permalink: /series/:name/
    sort_by: "date"

# =====================================================
# تنظیمات پیش‌فرض مطالب
# =====================================================

defaults:

  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: fa
      comments: false
      share: true

  - scope:
      path: ""
      type: books
    values:
      layout: work
      lang: fa
      comments: false

  - scope:
      path: ""
      type: screenplays
    values:
      layout: work
      lang: fa
      comments: false

  - scope:
      path: ""
      type: plays
    values:
      layout: work
      lang: fa
      comments: false

  - scope:
      path: ""
      type: stories
    values:
      layout: work
      lang: fa
      comments: false

  - scope:
      path: ""
      type: poetry
    values:
      layout: work
      lang: fa
      comments: false

  - scope:
      path: ""
      type: series
    values:
      layout: work
      lang: fa
      comments: false

# =====================================================
# افزونه‌ها
# =====================================================

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-paginate

feed:
  path: "feed.xml"
  posts_limit: 20
  excerpt_only: false

sitemap:
  path: "sitemap.xml"
  exclude:
    - "/404.html"
    - "/search/"

twitter:
  username: ""
  card: summary_large_image

# =====================================================
# فشرده‌سازی خروجی
# =====================================================

compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  endings: all
  ignore:
    envs: [development]
  blanklines: false
  profile: false
  startings: [html, head, body]

# =====================================================
# محیط توسعه
# =====================================================

strict_front_matter: false
liquid:
  error_mode: warn

sass:
  sass_dir: _sass
  style: compressed

# =====================================================
# فایل‌های مستثنی
# =====================================================

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .pages.yml
  - .gitignore
  - .github
  - .vscode
  - .idea
  - "*.log"
  - "*.tmp"
  - test.html
