<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>حسین محمدی آمیرزا | نویسنده، شاعر و پژوهشگر</title>

  <meta name="description" content="وب‌سایت رسمی حسین محمدی آمیرزا؛ نویسنده، شاعر، پژوهشگر تاریخ و فیلمنامه‌نویس. آشنایی با آثار، نوشته‌ها، داستان‌ها و جهان فکری او.">
  <meta name="author" content="حسین محمدی آمیرزا">
  <meta name="theme-color" content="#171b25">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="حسین محمدی آمیرزا | نویسنده و شاعر">
  <meta property="og:description" content="جهانی از روایت، تاریخ، شعر و تأمل؛ در وب‌سایت حسین محمدی آمیرزا.">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="حسین محمدی آمیرزا">
  <meta name="twitter:description" content="نویسنده، شاعر، پژوهشگر تاریخ و فیلمنامه‌نویس">

  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    document.documentElement.classList.add("js-enabled");
  </script>

  <style>
    /* =====================================================
       هویت بصری
       ===================================================== */

    :root {
      --ink: #171b25;
      --ink-soft: #222938;
      --paper: #f7f4ed;
      --paper-deep: #eee8dc;
      --white: #fffdf9;
      --gold: #b99457;
      --gold-light: #d5bb89;
      --text: #282b32;
      --muted: #77756f;
      --line: rgba(37, 37, 37, .12);
      --line-light: rgba(255, 255, 255, .14);
      --red: #9f5145;
      --radius: 5px;
      --content: 1160px;
      --header-height: 82px;
      --shadow: 0 20px 60px rgba(28, 27, 24, .08);
      --font: "Vazirmatn", Tahoma, sans-serif;
      --nastaliq: "Noto Nastaliq Urdu", serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 24px);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--paper);
      font-family: var(--font);
      font-size: 14px;
      line-height: 2.1;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body,
    button,
    input,
    textarea {
      font-family: var(--font);
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 5px;
    }

    ::selection {
      color: var(--white);
      background: var(--red);
    }

    .container {
      width: min(var(--content), calc(100% - 48px));
      margin-inline: auto;
    }

    .section {
      padding-block: 112px;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 46px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .eyebrow::before {
      width: 27px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    .section-title {
      margin: 0;
      color: var(--ink);
      font-family: var(--nastaliq);
      font-size: clamp(34px, 4.6vw, 52px);
      font-weight: 700;
      line-height: 2;
      letter-spacing: 0;
    }

    .section-description {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 2.3;
    }

    .gold-line {
      width: 48px;
      height: 2px;
      margin-top: 24px;
      background: var(--gold);
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 11px 24px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 15px;
      font-weight: 600;
      transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: var(--ink);
      background: var(--gold-light);
    }

    .button-primary:hover {
      background: #e4cea3;
    }

    .button-outline {
      color: var(--white);
      border-color: rgba(255, 255, 255, .35);
      background: transparent;
    }

    .button-outline:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--red);
      font-size: 14px;
      font-weight: 600;
    }

    .text-link span {
      transition: transform .2s ease;
    }

    .text-link:hover span {
      transform: translateX(-4px);
    }

    /* =====================================================
       نوار بالای سایت
       ===================================================== */

    .site-header {
      position: sticky;
      z-index: 100;
      top: 0;
      height: var(--header-height);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(23, 27, 37, .97);
      color: var(--white);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      flex-shrink: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(213, 187, 137, .65);
      color: var(--gold-light);
      font-family: var(--nastaliq);
      font-size: 22px;
      line-height: 1;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.9;
    }

    .brand-caption {
      color: #aaa8a3;
      font-size: 10px;
      line-height: 1.6;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: clamp(15px, 2.5vw, 32px);
    }

    .site-nav a {
      position: relative;
      padding-block: 8px;
      color: #d0cfc9;
      font-size: 13px;
      transition: color .2s ease;
    }

    .site-nav a::after {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      content: "";
      background: var(--gold-light);
      transition: width .25s ease;
    }

    .site-nav a:hover,
    .site-nav a[aria-current="location"] {
      color: var(--gold-light);
    }

    .site-nav a:hover::after {
      width: 100%;
    }

    .header-contact {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      padding-inline: 18px;
      border: 1px solid rgba(213, 187, 137, .55);
      color: var(--gold-light);
      font-size: 12px;
      white-space: nowrap;
      transition: background .2s ease;
    }

    .header-contact:hover {
      background: rgba(213, 187, 137, .1);
    }

    .menu-toggle {
      display: none;
      width: 43px;
      height: 43px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-light);
      background: transparent;
      color: var(--white);
      cursor: pointer;
    }

    .menu-toggle svg {
      width: 21px;
      height: 21px;
    }

    /* =====================================================
       قهرمان صفحه
       ===================================================== */

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 650px;
      color: var(--white);
      background:
        radial-gradient(ellipse at 76% 32%, rgba(185, 148, 87, .13), transparent 33%),
        linear-gradient(125deg, #171b25 0%, #1d2230 55%, #202634 100%);
    }

    .hero::before {
      position: absolute;
      top: -200px;
      right: -180px;
      width: 580px;
      height: 580px;
      border: 1px solid rgba(213, 187, 137, .1);
      border-radius: 50%;
      content: "";
    }

    .hero::after {
      position: absolute;
      top: -115px;
      right: -95px;
      width: 410px;
      height: 410px;
      border: 1px solid rgba(213, 187, 137, .09);
      border-radius: 50%;
      content: "";
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 650px;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 64px;
      padding-block: 70px;
    }

    .hero-copy {
      padding-block: 16px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 25px;
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 500;
    }

    .hero-kicker::before {
      width: 34px;
      height: 1px;
      content: "";
      background: var(--gold);
    }

    .hero h1 {
      max-width: 650px;
      margin: 0;
      font-family: var(--nastaliq);
      font-size: clamp(44px, 6vw, 78px);
      font-weight: 700;
      line-height: 1.9;
      letter-spacing: 0;
    }

    .hero h1 .accent {
      color: var(--gold-light);
    }

    .hero-lead {
      max-width: 520px;
      margin: 25px 0 0;
      color: #c0c0bf;
      font-size: 15px;
      line-height: 2.5;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 32px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid var(--line-light);
    }

    .hero-meta span {
      color: #c5c4c0;
      font-size: 11px;
    }

    .hero-meta span::before {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-left: 9px;
      border-radius: 50%;
      content: "";
      background: var(--gold);
      vertical-align: middle;
    }

    /* ===== عکس دایره‌ای ===== */

    .hero-portrait {
      position: relative;
      width: min(100%, 380px);
      justify-self: center;
      padding: 0;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      background: #2b3039;
      box-shadow:
        0 0 0 3px var(--gold),
        0 0 0 10px #1d2230,
        0 0 0 11px rgba(185, 148, 87, .45),
        0 25px 55px rgba(0, 0, 0, .28);
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      filter: saturate(.9);
      transition: transform .7s cubic-bezier(.22, .61, .36, 1);
    }

    .portrait-frame:hover img {
      transform: scale(1.05);
    }

    .portrait-placeholder {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 30px;
      color: var(--gold-light);
      background: #2b3039;
      text-align: center;
    }

    .portrait-placeholder .placeholder-symbol {
      font-family: var(--nastaliq);
      font-size: 75px;
      line-height: 1.2;
    }

    /* ===== نوشته نستعلیق زیر عکس ===== */

    .portrait-note {
      display: block;
      margin-top: 42px;
      padding: 0;
      background: transparent;
      text-align: center;
    }

    .portrait-note strong {
      display: block;
      font-family: var(--nastaliq);
      font-size: clamp(36px, 5vw, 54px);
      font-weight: 700;
      line-height: 2;
      color: var(--gold-light);
      letter-spacing: 0;
    }

    .portrait-note span {
      display: block;
      margin-top: 4px;
      font-family: var(--nastaliq);
      font-size: clamp(15px, 2vw, 21px);
      font-weight: 400;
      line-height: 2.4;
      color: #c5c4c0;
      letter-spacing: 0;
    }

    .portrait-note::before,
    .portrait-note::after {
      content: "";
      display: block;
      width: 60px;
      height: 1px;
      margin: 12px auto;
      background: var(--gold);
      opacity: .55;
    }

    .hero-bottom-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .6;
    }

    /* =====================================================
       معرفی
       ===================================================== */

    .intro-section {
      background: var(--white);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 100px;
      align-items: start;
    }

    .intro-aside {
      position: relative;
      padding: 36px 32px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .intro-aside::before {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 60px;
      height: 3px;
      content: "";
      background: var(--gold);
    }

    .quote-mark {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 70px;
      line-height: 1;
    }

    .intro-aside blockquote {
      margin: 12px 0 24px;
      color: var(--ink);
      font-family: var(--nastaliq);
      font-size: 23px;
      font-weight: 700;
      line-height: 2.2;
    }

    .intro-aside p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .intro-copy .section-title {
      font-size: clamp(32px, 4vw, 46px);
    }

    .intro-copy p {
      color: #5d5c58;
      font-size: 15px;
      line-height: 2.6;
    }

    .intro-copy .lead {
      color: var(--ink);
      font-size: 18px;
      font-weight: 500;
    }

    .intro-signature {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .signature-mark {
      color: var(--gold);
      font-size: 28px;
    }

    .intro-signature strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
    }

    .intro-signature span:last-child {
      color: var(--muted);
      font-size: 11px;
    }

    /* =====================================================
       زمینه‌های فعالیت
       ===================================================== */

    .fields-section {
      background: var(--paper-deep);
    }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid rgba(23, 27, 37, .13);
    }

    .field-card {
      min-height: 215px;
      padding: 30px 24px;
      border-left: 1px solid rgba(23, 27, 37, .13);
      transition: background .25s ease;
    }

    .field-card:last-child {
      border-left: 0;
    }

    .field-card:hover {
      background: rgba(255, 253, 249, .65);
    }

    .field-number {
      display: block;
      margin-bottom: 22px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .field-card h3 {
      margin: 0 0 10px;
      color: var(--ink);
      font-family: var(--nastaliq);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.9;
    }

    .field-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 2.2;
    }

    /* =====================================================
       آثار
       ===================================================== */

    .works-section {
      background: var(--paper);
    }

    .works-heading-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 25px;
    }

    .works-heading-row .section-heading {
      margin-bottom: 0;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
      margin-top: 48px;
    }

    .work-card {
      min-width: 0;
    }

    .work-cover {
      position: relative;
      overflow: hidden;
      display: flex;
      min-height: 310px;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #e8e1d4;
      isolation: isolate;
    }

    .work-cover::before {
      position: absolute;
      z-index: -1;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, .55);
      content: "";
      pointer-events: none;
    }

    .work-cover img {
      width: 100%;
      height: 310px;
      object-fit: contain;
      transition: transform .45s ease;
    }

    .work-card:hover .work-cover img {
      transform: scale(1.035);
    }

    .work-cover-fallback {
      display: none;
      width: 100%;
      min-height: 260px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 17px;
      padding: 20px;
      text-align: center;
    }

    .work-cover-fallback .book-symbol {
      color: rgba(255, 255, 255, .85);
      font-size: 39px;
    }

    .work-cover-fallback strong {
      max-width: 180px;
      color: white;
      font-family: var(--nastaliq);
      font-size: 22px;
      line-height: 2;
    }

    .cover-fire { background: #6d3831; }
    .cover-phoenix { background: #313b48; }
    .cover-fortress { background: #596047; }
    .cover-simple { background: #9b7b56; }

    .work-info {
      padding: 20px 2px 0;
    }

    .work-category {
      display: block;
      margin-bottom: 7px;
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
    }

    .work-info h3 {
      margin: 0;
      color: var(--ink);
      font-family: var(--nastaliq);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.9;
    }

    .work-info p {
      margin: 9px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 2.2;
    }

    .work-info .text-link {
      font-size: 13px;
    }

    .works-note {
      margin-top: 35px;
      padding: 17px 20px;
      border-right: 2px solid var(--gold);
      background: rgba(255, 253, 249, .7);
      color: var(--muted);
      font-size: 12px;
      line-height: 2.3;
    }

    /* =====================================================
       نوشته‌ها
       ===================================================== */

    .writing-section {
      position: relative;
      overflow: hidden;
      background: var(--ink);
      color: var(--white);
    }

    .writing-section .section-title {
      color: var(--white);
    }

    .writing-section .section-description {
      color: #b8b9bc;
    }

    .writing-section .eyebrow {
      color: var(--gold-light);
    }

    .writing-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 65px;
      align-items: center;
    }

    .writing-main {
      position: relative;
      padding: 35px 0;
    }

    .writing-main::before {
      position: absolute;
      z-index: 0;
      top: -10px;
      right: -30px;
      color: rgba(213, 187, 137, .08);
      font-size: 210px;
      line-height: 1;
      content: "«";
      pointer-events: none;
    }

    .writing-main > * {
      position: relative;
      z-index: 1;
    }

    .writing-main h3 {
      max-width: 520px;
      margin: 0 0 22px;
      font-family: var(--nastaliq);
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 700;
      line-height: 2;
    }

    .writing-main p {
      max-width: 550px;
      color: #c2c2c1;
      font-size: 14px;
      line-height: 2.5;
    }

    .writing-main .button {
      margin-top: 15px;
    }

    .writing-categories {
      border-top: 1px solid var(--line-light);
    }

    .writing-category {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line-light);
      transition: padding .25s ease;
    }

    .writing-category:hover {
      padding-inline: 8px;
    }

    .writing-category-copy strong {
      display: block;
      color: var(--white);
      font-size: 16px;
      font-weight: 600;
    }

    .writing-category-copy span {
      display: block;
      margin-top: 4px;
      color: #aaa9a6;
      font-size: 12px;
    }

    .writing-arrow {
      color: var(--gold-light);
      font-size: 23px;
    }

    /* =====================================================
       نگاه نویسنده
       ===================================================== */

    .philosophy-section {
      background: var(--white);
    }

    .philosophy-inner {
      display: grid;
      grid-template-columns: .75fr 1.25fr;
      gap: 85px;
      align-items: start;
    }

    .philosophy-label {
